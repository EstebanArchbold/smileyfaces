services:
  # ─── Base de datos PostgreSQL ───────────────────────────────────────────────
  smileyfaces-db:
    image: postgres:16-alpine
    container_name: smileyfaces-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smileyfaces
      POSTGRES_USER: smileyfaces
      POSTGRES_PASSWORD: ${SMILEYFACES_DB_PASSWORD}
    volumes:
      - smileyfaces_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smileyfaces"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proxy

  # ─── API / Backend (Node.js + Express) ──────────────────────────────────────
  smileyfaces-api:
    build: ./backend
    container_name: smileyfaces-api
    restart: unless-stopped
    depends_on:
      smileyfaces-db:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://smileyfaces:${SMILEYFACES_DB_PASSWORD}@smileyfaces-db:5432/smileyfaces
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      # Zona horaria del negocio: las citas se guardan como hora local sin offset
      TZ: ${BUSINESS_TIMEZONE:-America/Toronto}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Toronto}
      # Notificaciones push (web push / VAPID)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@smileyfaces.art}
      # Notificaciones por email (SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL}
    volumes:
      - smileyfaces_uploads:/app/uploads
    networks:
      - proxy

  # ─── Frontend (Angular → Nginx) ─────────────────────────────────────────────
  smileyfaces-frontend:
    build: ./frontend
    container_name: smileyfaces-frontend
    restart: unless-stopped
    ports:
      - "3080:80"        # Acceso directo: http://100.110.144.73:3080
    depends_on:
      - smileyfaces-api
    networks:
      - proxy

# ─── Volúmenes persistentes ───────────────────────────────────────────────────
volumes:
  smileyfaces_db_data:
  smileyfaces_uploads:

# ─── Red compartida (ya existe en el servidor) ────────────────────────────────
networks:
  proxy:
    external: true
    name: proxy
