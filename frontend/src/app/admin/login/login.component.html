<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/logo.png" alt="Smiley Faces" class="sidebar-logo-img">
      <h1 class="headline-md">Smiley Faces</h1>
      <p class="body-sm text-muted">Admin Portal</p>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-field">
        <label class="label-sm" for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="admin@smileyfaces.com" autocomplete="email">
      </div>

      <div class="form-field">
        <label class="label-sm" for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Enter password" autocomplete="current-password">
      </div>

      @if (error()) {
        <div class="login-error">{{ error() }}</div>
      }

      <button type="submit" class="login-btn" [disabled]="loading()">
        @if (loading()) {
          Signing in...
        } @else {
          Sign In
        }
      </button>
    </form>
  </div>
</div>
