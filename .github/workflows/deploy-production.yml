name: 🚀 Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to server
    runs-on: self-hosted

    steps:
      - name: git pull + docker compose up
        run: |
          cd ~/docker/smileyfaces
          git pull origin main
          docker compose up -d --build
          docker image prune -f
          echo "✅ Deploy completado: $(date)"
