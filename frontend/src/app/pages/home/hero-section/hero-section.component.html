<section class="hero">
  <div class="hero-inner">
    <div class="hero-content">
      <h1 class="display-lg">
        @for (line of titleLines(); track $index) {
          <span [class.text-emerald]="$index === 1">{{ line }}</span>@if (!$last) {<br>}
        }
      </h1>
      <p class="body-lg hero-subtitle">{{ subtitle() }}</p>
      <a routerLink="/booking" class="cta-btn">{{ cta() }}</a>
      <div class="hero-badge">
        <span class="material-symbols-outlined">local_florist</span>
        <span class="body-sm">{{ badge() }}</span>
      </div>
    </div>
    <div class="hero-image">
      @if (image()) {
        <img class="hero-image-photo" [src]="image()" alt="Hero image">
      } @else {
        <div class="hero-image-placeholder">
          <span class="material-symbols-outlined">face_retouching_natural</span>
          <p>Hero Image</p>
        </div>
      }
    </div>
  </div>
</section>
