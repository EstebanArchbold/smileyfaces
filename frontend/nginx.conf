server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large image uploads (must be >= multer fileSize limit in the backend)
    client_max_body_size 50M;

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin routes get the admin app shell (admin PWA manifest + iOS title).
    # ngsw-config excludes /admin from the service worker's navigation cache
    # so this HTML is always fetched from the server.
    location ^~ /admin {
        add_header Cache-Control "no-cache";
        try_files /index-admin.html =404;
    }

    # Service worker files must never be cached long-term: a cached
    # ngsw-worker.js would pin users to an old version of the app.
    # Exact-match locations take priority over the static-asset regex below.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }
    location = /manifest-admin.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend container
    location ^~ /api/ {
        proxy_pass http://smileyfaces-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploaded images to backend.
    # ^~ is required: without it the static-asset regex below wins for .png/.jpg
    # and nginx looks for the file locally instead of proxying (404).
    location ^~ /uploads/ {
        proxy_pass http://smileyfaces-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
