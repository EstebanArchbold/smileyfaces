<nav [class.scrolled]="scrolled()" [class.menu-open]="menuOpen()">
  <div class="nav-inner">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img src="assets/navbar-logo.png" alt="Smiley Faces" class="logo-img">
      <span class="logo-text">Smiley Faces</span>
    </a>

    <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Toggle menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <div class="nav-links" [class.open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
      <div class="nav-dropdown" [class.open]="servicesOpen()">
        <button
          type="button"
          class="dropdown-trigger"
          [class.active]="servicesOpen()"
          (click)="toggleServices($event)"
          [attr.aria-expanded]="servicesOpen()">
          Services
          <span class="material-symbols-outlined dropdown-chevron">expand_more</span>
        </button>
        <div class="dropdown-menu">
          @for (service of services; track service.slug) {
            <a
              [routerLink]="['/services', service.slug]"
              routerLinkActive="active"
              (click)="closeMenu()">
              <span class="material-symbols-outlined">{{ service.icon }}</span>
              {{ service.label }}
            </a>
          }
        </div>
      </div>
      <a routerLink="/gallery" routerLinkActive="active" (click)="closeMenu()">Gallery</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      <a routerLink="/policy" routerLinkActive="active" (click)="closeMenu()">Policy</a>
      <a routerLink="/booking" class="book-now-btn" (click)="closeMenu()">Book Now</a>
    </div>
  </div>
</nav>
