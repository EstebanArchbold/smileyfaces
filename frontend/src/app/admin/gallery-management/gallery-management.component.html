<div class="admin-header">
      <h1 class="headline-lg">Gallery</h1>
      <p class="body-md text-muted">Manage your portfolio images.</p>
    </div>

    <div class="upload-section">
      <h3 class="title-lg">Upload New Image</h3>
      <div class="upload-form">
        <div class="upload-fields">
          <div class="form-field">
            <label class="label-sm">Title (optional)</label>
            <input type="text" [(ngModel)]="title" placeholder="Image title">
          </div>
          <div class="form-field">
            <label class="label-sm">Category</label>
            <select [(ngModel)]="category">
              @for (cat of categories(); track cat.value) {
                <option [value]="cat.value">{{ cat.label }}</option>
              }
            </select>
          </div>
          <div class="form-field">
            <label class="label-sm">Image</label>
            <input type="file" accept="image/*" (change)="onFileSelected($event)">
          </div>
        </div>
        <button class="upload-btn" (click)="upload()" [disabled]="!selectedFile || uploading()">
          @if (uploading()) { Uploading... } @else { Upload Image }
        </button>
      </div>
    </div>

    <div class="gallery-grid">
      @for (item of items(); track item.id) {
        <div class="gallery-card">
          <div class="gallery-card-image">
            <img [src]="item.image_path" [alt]="item.title || 'Gallery image'">
            <button class="delete-btn" (click)="deleteItem(item.id)" title="Delete">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
          <div class="gallery-card-info">
            <span class="body-sm">{{ item.title || 'Untitled' }}</span>
            <span class="label-sm text-muted">{{ item.category }}</span>
          </div>
        </div>
      }
      @if (items().length === 0) {
        <div class="empty-state">
          <span class="material-symbols-outlined">add_photo_alternate</span>
          <p class="body-md text-muted">No images yet. Upload your first portfolio piece above.</p>
        </div>
      }
    </div>
