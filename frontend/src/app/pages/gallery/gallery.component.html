<section class="gallery-page section-padding">
  <div class="container">
    <div class="gallery-page-header">
      <p class="label-sm text-muted">Our Works</p>
      <h1 class="headline-lg">The Gallery</h1>
    </div>

    <div class="filter-pills">
      @for (cat of categories(); track cat.value) {
        <button
          class="filter-pill"
          [class.active]="activeCategory() === cat.value"
          (click)="filterBy(cat.value)">
          {{ cat.label }}
        </button>
      }
    </div>

    <div class="masonry-grid">
      @for (item of items(); track item.id; let i = $index) {
        <div class="masonry-item" (click)="openLightbox(i)">
          <img [src]="item.image_path" [alt]="item.title || 'Gallery work'" loading="lazy">
          @if (item.title) {
            <div class="masonry-overlay">
              <!-- <span class="body-sm">{{ item.title }}</span> -->
            </div>
          }
        </div>
      }
      @if (items().length === 0) {
        <div class="empty-gallery">
          <span class="material-symbols-outlined">collections</span>
          <p class="body-lg">Gallery is being curated. Check back soon.</p>
        </div>
      }
    </div>
  </div>
</section>

<app-lightbox
  [images]="imageUrls"
  [currentIndex]="lightboxIndex()"
  [visible]="lightboxVisible()"
  (close)="closeLightbox()" />
